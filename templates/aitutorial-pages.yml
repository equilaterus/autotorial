name: Publish Autotorial to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lessons/**"
      - "lib/autotorial/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lib/autotorial/package-lock.json
      - run: npm ci --prefix lib/autotorial
      - run: npm run build --prefix lib/autotorial
      - name: Produce every lesson with free local TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          for lesson in lessons/*/INDEX.md; do
            slug="$(basename "$(dirname "$lesson")")"
            node lib/autotorial/dist/cli.js produce "$slug" --host "$GITHUB_WORKSPACE"
          done
      - run: node lib/autotorial/dist/cli.js publish --host "$GITHUB_WORKSPACE" --base "./"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bin/aitutorial/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
