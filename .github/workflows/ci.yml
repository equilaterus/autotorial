name: AutoTorial CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: autotorial-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install narration test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Verify lockfile and install dependencies
        run: npm ci
      - name: Run type, unit, browser, and acceptance checks
        run: npm run check
